name: SmartUni.Ai Backend CI

on:
  push:
    branches: [main, dev]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff check + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check app/ tests/ scripts/
      - run: ruff format --check app/ tests/ scripts/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m mypy app/ --ignore-missing-imports

  test:
    name: Test (pytest + PostgreSQL)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: smartuni
          POSTGRES_PASSWORD: smartuni
          POSTGRES_DB: smartuni_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: test
      AUTH_MODE: dev
      DATABASE_URL: "postgresql+psycopg://smartuni:smartuni@localhost:5432/smartuni_test"
      DIRECT_URL: "postgresql+psycopg://smartuni:smartuni@localhost:5432/smartuni_test"
      JWT_SECRET: ci_test_secret_32_bytes_here_ok
      CORS_ORIGINS: "http://localhost:3000"
      LLM_PROVIDER: mock
      PAYMENT_MODE: mock
      STORAGE_BACKEND: local
      PUBLIC_VERIFY_BASE_URL: "http://localhost:3000"
      ENABLE_SCHEDULER: "false"
      TRANSPORT_SIMULATOR: "false"
      FACE_VERIFIER: simulated

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: alembic upgrade head
      - run: pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=70
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (cache layers)
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/Dockerfile
          target: runtime
          push: false
          tags: smartuni-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  export-openapi:
    name: Export OpenAPI spec
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Export OpenAPI JSON
        env:
          ENV: test
          AUTH_MODE: dev
          DATABASE_URL: "sqlite+aiosqlite:///./test.db"
          JWT_SECRET: ci_test_secret_32_bytes_here_ok
          LLM_PROVIDER: mock
          PAYMENT_MODE: mock
        run: python scripts/export_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: backend/docs/openapi.json
          retention-days: 30
