[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:jose",
    "ignore::DeprecationWarning:passlib",
    "ignore::DeprecationWarning:starlette",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "PLC", # pylint convention
]
ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # do not perform function calls in default arguments (FastAPI Depends pattern)
    "PLC0415", # import should be at top-level (lazy imports for heavy optional dependencies like reportlab, qrcode, google.genai)
    "E711",    # comparison to None (SQLAlchemy ColumnElement == None or != None is idiomatic SQL generation)
    "E712",    # comparison to True (SQLAlchemy ColumnElement == True is idiomatic SQL generation)
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"tests/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = [
    "alembic/",
    "scripts/",
]

[[tool.mypy.overrides]]
module = [
    "razorpay.*",
    "reportlab.*",
    "qrcode.*",
    "apscheduler.*",
    "structlog.*",
    "slowapi.*",
    "google.genai.*",
    "sklearn.*",
    "joblib.*",
]
ignore_missing_imports = true
